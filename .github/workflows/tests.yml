name: Pruebas

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Comprobación de tipos: barata y caza la mitad de los errores
      - run: npx tsc --noEmit

      # Cálculos: ingresos, segmentación y campañas
      - run: npm run test:dominio

      - run: npx playwright install --with-deps chromium

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Pantallas. Sin E2E_EMAIL solo corre la parte pública; con credenciales
      # de un usuario de pruebas corre también el panel.
      - run: npm run test:pantallas
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
